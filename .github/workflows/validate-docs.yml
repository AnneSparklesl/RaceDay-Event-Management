name: Validate Docs Folder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "Error: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist in docs
        run: |
          required_files=("docs/raceday_erd.png" "docs/api-endpoint-plan.md" "docs/raceday_schema.sql")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing."
              exit 1
            fi
            echo "Found: $file"
          done

      - name: All checks passed
        run: echo "Repository structure is valid. All required Part 1 documents are present."
